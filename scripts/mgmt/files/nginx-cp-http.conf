# Managed by scripts/mgmt/setup.sh. The console, GitHub's webhooks and the
# bring-your-own-server installer, on a publicly trusted certificate.
server {
    listen 80;
    listen [::]:80;
    server_name __CP_HOST__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
