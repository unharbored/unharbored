# Managed by scripts/mgmt/setup.sh. The name agents use: enrollment, the
# agent download and the gateway's events. Served with a certificate from the
# organisation CA, which agents pin; browsers will not trust it, and nothing
# here is for them. Only the API answers.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __AGENT_HOST__ __EXTRA_AGENT_NAMES__;
    ssl_certificate /etc/cloud-manager/server.crt;
    ssl_certificate_key /etc/cloud-manager/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/cloud-manager/control-plane/public;

    location /api/ { try_files /nonexistent /index.php?$query_string; }
    location = /up { try_files /nonexistent /index.php?$query_string; }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location / { return 404; }
}
