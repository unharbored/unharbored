# Managed by scripts/mgmt/setup.sh. The HTTPS half; see nginx-cp-http.conf.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __CP_HOST__;
    ssl_certificate /etc/letsencrypt/live/__CP_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CP_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /srv/cloud-manager/control-plane/public;
    index index.php;

    # The console's websocket transport: Unscripted component calls over
    # Reverb. Reverb itself listens on loopback only. The trailing slash
    # matters: a bare /app prefix would also swallow the console's /apps pages.
    location /app/ {
        proxy_pass http://127.0.0.1:9445;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location ~ \.php$ { rewrite ^ /index.php last; }
    location ~ /\.(?!well-known).* { deny all; }
}
